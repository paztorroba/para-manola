<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Para Manola ✿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Playfair Display', serif; }

    #screen1 {
      background: #8B1A1A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 32px;
      transition: opacity 0.6s ease;
    }
    #screen1.fade-out { opacity: 0; pointer-events: none; }

    .s1-flower { font-size: 26px; color: #F9D7D4; margin-bottom: 22px; }

    .s1-name {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: clamp(22px, 5vw, 30px);
      color: #F9D7D4;
      opacity: 0.85;
      margin-bottom: 14px;
    }

    .s1-title {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: clamp(36px, 9vw, 68px);
      color: #F9D7D4;
      line-height: 1.08;
      margin-bottom: 52px;
      max-width: 640px;
    }

    .s1-btn {
      background: #F9D7D4;
      color: #8B1A1A;
      border: none;
      border-radius: 50px;
      padding: 18px 52px;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .s1-btn:hover { transform: scale(1.04); background: #fff; }

    #screen2 {
      display: none;
      flex-direction: column;
      align-items: center;
      background: #F0CCCA;
      min-height: 100vh;
      padding: 44px 20px 60px;
      position: relative;
    }
    #screen2.visible { display: flex; }

    #sparkle-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .main-img {
      width: 100%;
      max-width: 440px;
      border-radius: 18px;
      display: block;
      margin-bottom: 32px;
      box-shadow: 0 8px 32px rgba(139,26,26,0.15);
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 0.7s ease 0.1s, transform 0.7s ease 0.1s;
    }
    .main-img.appeared { opacity: 1; transform: scale(1); }

    .spotify-block { width: 100%; max-width: 440px; }

    .spotify-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #8B1A1A;
      color: #F9D7D4;
      border: none;
      border-radius: 50px;
      padding: 18px 28px;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .spotify-btn:hover { transform: scale(1.02); background: #6e1414; }
    .spotify-btn svg { flex-shrink: 0; }

    .spotify-embed { width: 100%; margin-top: 14px; display: none; }
    .spotify-embed.open { display: block; }
    .spotify-embed iframe { width: 100%; border-radius: 14px; border: none; }
  </style>
</head>
<body>

<div id="screen1">
  <div class="s1-flower">✿</div>
  <p class="s1-name">Manola,</p>
  <h1 class="s1-title">ya casi llega el finde que estabas esperando.</h1>
  <button class="s1-btn" onclick="openCard()">Abrir 🎀</button>
</div>

<div id="screen2">
  <canvas id="sparkle-canvas"></canvas>
  <img class="main-img" id="main-img" src="weekend_essentials_manu.png" alt="Weekend Essentials para Manola"/>
  <div class="spotify-block">
    <button class="spotify-btn" onclick="toggleSpotify(this)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 18V5l12-2v13" stroke="#F9D7D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="6" cy="18" r="3" stroke="#F9D7D4" stroke-width="1.8"/>
        <circle cx="18" cy="16" r="3" stroke="#F9D7D4" stroke-width="1.8"/>
      </svg>
      Tocá acá para ir entrando en mood
    </button>
    <div class="spotify-embed" id="spotify-embed">
      <iframe
        src="https://open.spotify.com/embed/playlist/2lCCBicViLXrNWDG51Hfwb?utm_source=generator&theme=0"
        height="352"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </div>
  </div>
</div>

<script>
  function openCard() {
    const s1 = document.getElementById('screen1');
    const s2 = document.getElementById('screen2');
    s1.classList.add('fade-out');
    setTimeout(() => {
      s1.style.display = 'none';
      s2.classList.add('visible');
      window.scrollTo(0, 0);
      const img = document.getElementById('main-img');
      requestAnimationFrame(() => requestAnimationFrame(() => img.classList.add('appeared')));
      setTimeout(launchSparkles, 350);
    }, 600);
  }

  function launchSparkles() {
    const canvas = document.getElementById('sparkle-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const W = canvas.width, H = canvas.height;
    const colors = ['#8B1A1A','#D4847E','#F9D7D4','#ffffff','#c45c5c','#e8a0a0'];
    const particles = [];

    for (let i = 0; i < 70; i++) {
      particles.push({
        x: W * 0.5 + (Math.random() - 0.5) * W * 0.9,
        y: H * 0.4 + (Math.random() - 0.5) * H * 0.7,
        vx: (Math.random() - 0.5) * 0.9,
        vy: (Math.random() - 0.5) * 0.9,
        size: 3 + Math.random() * 7,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 1,
        rot: Math.random() * Math.PI * 2,
        rotV: (Math.random() - 0.5) * 0.18,
        type: Math.random() > 0.45 ? 'star4' : 'cross',
        life: 0.004 + Math.random() * 0.004
      });
    }

    function drawStar4(ctx, x, y, r, color, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const angle = (i * Math.PI) / 4;
        const len = i % 2 === 0 ? r : r * 0.35;
        const px = x + Math.cos(angle) * len;
        const py = y + Math.sin(angle) * len;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }

    function drawCross(ctx, x, y, r, color, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
      ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
      ctx.stroke();
      ctx.restore();
    }

    let raf;
    function tick() {
      ctx.clearRect(0, 0, W, H);
      let alive = false;
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.rotV;
        p.alpha -= p.life;
        if (p.alpha > 0) {
          alive = true;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.translate(-p.x, -p.y);
          if (p.type === 'star4') drawStar4(ctx, p.x, p.y, p.size, p.color, p.alpha);
          else drawCross(ctx, p.x, p.y, p.size * 0.8, p.color, p.alpha);
          ctx.restore();
        }
      }
      if (alive) raf = requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, W, H);
    }
    tick();
  }

  function toggleSpotify(btn) {
    const embed = document.getElementById('spotify-embed');
    embed.classList.toggle('open');
    if (embed.classList.contains('open')) {
      setTimeout(() => embed.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
    }
  }
</script>
</body>
</html>
