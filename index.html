<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Italia 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍋</text></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --black: #1A2A2E;
  --white: #FFFFFF;
  --bg: #F0F4F6;
  --bg-dark: #E2EDF0;
  --teal: #B0D9D9;
  --teal-dark: #80C0C0;
  --accent: #FF6740;
  --accent-dark: #E04E28;
  --gray-100: #E4EDF0;
  --gray-200: #D0E0E4;
  --gray-300: #B0CDD4;
  --gray-500: #6A9AA8;
  --gray-700: #2A5A68;
  --font: -apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  --safe-top: env(safe-area-inset-top,0px);
  --safe-bottom: env(safe-area-inset-bottom,0px);
  --top-h: 104px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--black);-webkit-font-smoothing:antialiased}

/* ── APP ── */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ── TOP BAR ── */
.top-bar{
  flex-shrink:0;
  background:var(--teal);
  border-bottom:none;
  position:relative;z-index:10;
  padding-top:calc(var(--safe-top) + 12px);
}
.top-bar-row1{display:flex;align-items:center;justify-content:space-between;padding:0 18px 10px}
.top-title{font-size:20px;font-weight:700;letter-spacing:-0.4px;color:#1E5F6A}
.top-right{display:flex;align-items:center;gap:8px}
.sync-pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.3);border-radius:20px;padding:5px 10px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.5);transition:background .3s}
.sync-dot.ok{background:#22C55E}
.sync-dot.err{background:#EF4444}
.sync-label{font-size:11px;color:#1E5F6A;opacity:0.8}
.cal-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.45);color:#1E5F6A;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── DAY NAV ROW ── */
.day-nav-row{display:flex;align-items:center;padding:0 12px 12px;gap:6px;background:var(--teal)}
.day-nav-pills{flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;display:flex;gap:6px;padding:2px 0}
.day-nav-pills::-webkit-scrollbar{display:none}
.day-pill{flex-shrink:0;padding:6px 13px;border-radius:20px;border:1.5px solid rgba(30,95,106,0.2);background:rgba(255,255,255,0.25);cursor:pointer;font-size:12px;font-weight:500;color:rgba(30,95,106,0.5);transition:all .15s;white-space:nowrap;font-family:var(--font)}
.day-pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.day-pill.today{border-color:#1E5F6A;color:#1E5F6A;background:rgba(255,255,255,0.4)}
.nav-arrow-btn{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(30,95,106,0.2);background:rgba(255,255,255,0.25);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;color:#1E5F6A}
.nav-arrow-btn:active{background:rgba(255,255,255,0.2)}
.nav-arrow-btn:disabled{opacity:0.25;cursor:not-allowed}
.nav-arrow-btn svg path{stroke:#1E5F6A}

/* ── MAIN ── */
.main{flex:1;overflow:hidden;position:relative}
.swipe-container{position:absolute;inset:0;overflow:hidden}
.swipe-track{display:flex;height:100%;transition:transform .3s cubic-bezier(.4,0,.2,1);will-change:transform}
.day-card{flex-shrink:0;width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;background:var(--bg)}
/* ── DAY HERO ── */
.day-hero{padding:16px;margin:12px 12px 0;border-radius:14px;background:var(--white);border:0.5px solid var(--gray-200)}
.day-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.day-label{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.day-title{font-size:24px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.day-date-badge{background:var(--accent);color:#fff;border-radius:10px;padding:6px 10px;text-align:center;flex-shrink:0}
.badge-day{font-size:18px;font-weight:700;line-height:1;color:#fff}
.badge-month{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.75);margin-top:1px}
.day-hero-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.meta-chip{display:flex;align-items:center;gap:5px;background:var(--bg-dark);border-radius:20px;padding:5px 10px;font-size:12px;color:var(--gray-700)}
.today-badge{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:20px}

/* ── SECTIONS AS CARDS ── */
.day-section{padding:14px 16px;background:var(--white);border-radius:14px;border:0.5px solid var(--gray-200);margin:8px 12px 0}
.section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--gray-500);margin-bottom:10px}

/* ── TRANSPORT ── */
.transport-card{background:var(--bg-dark);border-radius:12px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
.transport-icon{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.transport-icon svg{width:20px;height:20px;fill:var(--gray-700)}
.transport-body{flex:1}
.transport-text{font-size:13px;line-height:1.5;color:var(--gray-700)}
/* Multi-flight */
.flight-list{display:flex;flex-direction:column;gap:8px}
.flight-item{background:var(--white);border-radius:10px;padding:10px 12px;border:1px solid var(--gray-200)}
.flight-num{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gray-500);margin-bottom:4px}
.flight-route{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.flight-arrow{color:var(--gray-300);font-size:12px}
.flight-detail{font-size:12px;color:var(--gray-500);margin-top:3px}

/* ── PLAN DEL DÍA ── */
.plan-section{padding:14px 16px;background:var(--white);border-radius:14px;border:0.5px solid var(--gray-200);margin:8px 12px 0}
.plan-block{margin-bottom:14px}
.plan-block:last-child{margin-bottom:0}
.plan-time-label{font-size:13px;font-weight:700;color:var(--black);margin-bottom:6px;margin-top:2px}
.plan-items{display:flex;flex-direction:column;gap:5px;padding-left:12px}
.plan-item{font-size:14px;line-height:1.55;color:var(--gray-700);position:relative;padding-left:12px}
.plan-item::before{content:'';position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:var(--gray-300)}

/* ── RECORDAR ── */
.recordar-card{background:transparent;padding:4px 0;font-size:13px;color:var(--gray-700);line-height:1.5}
.recordar-item{display:flex;align-items:flex-start;gap:8px;margin-bottom:5px;font-size:13px;color:var(--gray-700)}
.recordar-item:last-child{margin-bottom:0}
.recordar-bullet{width:5px;height:5px;border-radius:50%;background:var(--gray-500);flex-shrink:0;margin-top:6px}

/* ── TICKETS ── */
.ticket-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--white);border:1px solid var(--gray-200);border-radius:10px;margin-bottom:6px;text-decoration:none;color:inherit}
.ticket-item:last-child{margin-bottom:0}
.ticket-icon-wrap{width:32px;height:32px;border-radius:8px;background:var(--bg-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ticket-icon-wrap svg{width:16px;height:16px;fill:var(--gray-700)}
.ticket-body{flex:1;min-width:0}
.ticket-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket-sub{font-size:11px;color:var(--gray-500)}
.ticket-arrow{color:var(--gray-300);font-size:14px;flex-shrink:0}

/* ── MAP ── */
.map-section{padding:14px 16px;background:var(--white);border-radius:14px;border:0.5px solid var(--gray-200);margin:8px 12px 0}
.day-map{width:100%;height:220px;border-radius:12px;overflow:hidden;border:1px solid var(--gray-200);background:var(--bg-dark);position:relative;outline:none}
.day-map *{outline:none}
.map-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg-dark);border-radius:12px;font-size:13px;color:var(--gray-500)}
.open-maps-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);text-decoration:none}
.map-places{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.map-place-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg-dark);border-radius:9px}
.map-place-num{width:18px;height:18px;border-radius:50%;background:#fff;border:1.5px solid #FF6740;color:#FF6740;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.map-place-name{font-size:12px;color:var(--gray-700)}

/* ── ACTIONS ── */
.actions-section{padding:12px 12px 20px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.action-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;font-size:14px;font-family:var(--font);font-weight:500;cursor:pointer;transition:all .15s}
.action-btn-outline{border:1.5px solid var(--gray-200);background:var(--white);color:var(--black)}
.action-btn-outline:active{background:var(--bg-dark)}
.action-btn-dashed{border:1.5px dashed var(--gray-300);background:var(--white);color:var(--gray-500)}
.action-btn-dashed:active{background:var(--bg-dark)}

/* ── PRE/POST TRIP ── */
.special-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;height:100%;background:var(--bg)}
.special-screen img{width:160px;height:160px;object-fit:cover;border-radius:20px;margin-bottom:24px}
.special-title{font-size:26px;font-weight:700;letter-spacing:-.4px;margin-bottom:8px}
.special-sub{font-size:15px;color:var(--gray-500);line-height:1.5;margin-bottom:24px}
.countdown-wrap{background:var(--black);color:var(--white);border-radius:16px;padding:20px 28px;margin-bottom:20px}
.countdown-num{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1}
.countdown-label{font-size:12px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.countdown-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:var(--accent);border-radius:16px;padding:16px;margin-bottom:20px}
.countdown-unit{text-align:center}
.countdown-unit-num{font-size:28px;font-weight:700;color:#fff;line-height:1}
.countdown-unit-label{font-size:9px;color:rgba(255,255,255,0.75);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.airport-card{background:var(--bg-dark);border:none;border-radius:14px;padding:14px 16px;width:100%;text-align:left;margin-top:8px}
.airport-card-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--gray-500);margin-bottom:6px}
.airport-card-text{font-size:13px;color:var(--gray-700);line-height:1.5}

/* ── CALENDAR MODAL ── */
.cal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
.cal-overlay.open{display:flex}
.cal-sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;padding:16px 20px calc(20px + var(--safe-bottom));max-height:70vh;overflow-y:auto}
/* Desktop: smaller modal */
@media(min-width:600px){
  .cal-sheet{max-width:420px;border-radius:20px;margin-bottom:40px;max-height:80vh}
}
.cal-handle{width:36px;height:4px;background:var(--gray-300);border-radius:2px;margin:0 auto 14px}
.cal-title{font-size:17px;font-weight:700;margin-bottom:14px}
.cal-month{margin-bottom:20px}
.cal-month-name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:3px}
.cal-weekday{text-align:center;font-size:11px;font-weight:500;color:var(--gray-500);padding-bottom:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px;font-weight:500;color:var(--gray-300);position:relative;font-family:var(--font)}
.cal-cell.in-trip{color:var(--black);cursor:pointer}
.cal-cell.in-trip:active{background:var(--bg-dark)}
.cal-cell.is-current{background:var(--accent);color:var(--white)!important}
.cal-cell.is-today:not(.is-current){border:2px solid var(--black)}
.city-dot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.cal-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--gray-700)}
.cal-legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ── MODALS ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:20px 20px calc(20px + var(--safe-bottom))}
@media(min-width:600px){.modal-sheet{max-width:480px;border-radius:20px;margin-bottom:40px}}
.modal-handle{width:36px;height:4px;background:var(--gray-300);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--gray-500);display:block;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--gray-200);border-radius:12px;background:var(--white);color:var(--black);font-size:15px;font-family:var(--font);outline:none;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#1E5F6A}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.btn{padding:13px 18px;border-radius:12px;border:none;cursor:pointer;font-size:15px;font-family:var(--font);font-weight:600;flex:1;transition:all .15s;text-align:center}
.btn-black{background:#1E5F6A;color:var(--white)}
.btn-gray{background:var(--bg-dark);color:var(--black)}

/* ── SWAP MODAL ── */
.swap-intro{font-size:13px;color:var(--gray-500);margin-bottom:14px;line-height:1.5}
.swap-from-card{background:var(--bg-dark);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.swap-from-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--gray-500);margin-bottom:4px}
.swap-from-day{font-size:15px;font-weight:600}
.swap-divider{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.swap-divider-line{flex:1;height:1px;background:var(--gray-200)}
.swap-divider-text{font-size:11px;color:var(--gray-500);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.swap-day-list{display:flex;flex-direction:column;gap:7px}
.swap-day-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--gray-200);border-radius:12px;cursor:pointer;transition:all .15s;background:var(--white)}
.swap-day-item.selected{border-color:#1E5F6A;background:var(--bg-dark)}
.swap-day-date{font-size:12px;font-weight:700;flex-shrink:0;width:40px}
.swap-day-name{font-size:13px;color:var(--gray-700);flex:1}
.swap-day-radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--gray-300);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.swap-day-item.selected .swap-day-radio{background:var(--black);border-color:var(--black)}
.swap-day-radio-inner{width:8px;height:8px;border-radius:50%;background:var(--white)}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(20px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(16px);background:var(--black);color:var(--white);padding:11px 20px;border-radius:24px;font-size:13px;font-weight:500;opacity:0;transition:all .3s;z-index:300;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── LOADING ── */
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:14px}
.loading-title{font-size:24px;font-weight:700}
.spinner{width:22px;height:22px;border:2.5px solid var(--gray-200);border-top-color:var(--black);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* SVG icons */
.icon-svg{display:inline-block;vertical-align:middle}
</style>
</head>
<body>

<div class="loading-screen" id="loading">
  <div style="font-size:40px">🍋</div>
  <div class="loading-title">Italia 2026</div>
  <div class="spinner"></div>
</div>

<div id="app" style="display:none">
  <div class="top-bar">
    <div class="top-bar-row1">
      <div>
        <div class="top-title">🍋 Italia 2026</div>
      </div>
      <div class="top-right">
        <div class="sync-pill">
          <div class="sync-dot" id="sync-dot"></div>
          <span class="sync-label" id="sync-label">...</span>
        </div>
        <button class="cal-btn" onclick="openCal()" aria-label="Calendario">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1E5F6A"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/></svg>
      </button>
      </div>
    </div>
    <div class="day-nav-row">
      <button class="nav-arrow-btn" id="btn-prev" onclick="goToDay(currentIdx-1)" aria-label="Día anterior">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="day-nav-pills" id="carousel-nav"></div>
      <button class="nav-arrow-btn" id="btn-next" onclick="goToDay(currentIdx+1)" aria-label="Día siguiente">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="main">
    <div class="swipe-container" id="swipe-container">
      <div class="swipe-track" id="swipe-track"></div>
    </div>
  </div>
</div>

<!-- CALENDAR -->
<div class="cal-overlay" id="cal-overlay" onclick="if(event.target===this)closeCal()">
  <div class="cal-sheet">
    <div class="cal-handle"></div>
    <div class="cal-title">Ir a un día</div>
    <div id="cal-content"></div>
  </div>
</div>

<!-- MODAL: Edit Day -->
<div class="modal-overlay" id="modal-edit" onclick="if(event.target===this)closeModal('modal-edit')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Editar día</div>
    <input type="hidden" id="edit-idx">
    <div class="field"><label>Destino / Plan principal</label><input type="text" id="edit-ciudad"></div>
    <div class="field"><label>Hospedaje</label><input type="text" id="edit-hospedaje" placeholder="Nombre o dirección del alojamiento"></div>
    <div class="field-row">
      <div class="field"><label>Check-in</label><input type="text" id="edit-checkin" placeholder="3pm"></div>
      <div class="field"><label>Tipo transporte</label>
        <select id="edit-transport">
          <option value="">Sin transporte</option>

// ── FIREBASE ──
async function fbGet(p){const r=await fetch(`${FIREBASE_URL}/${p}.json`);return r.json();}
async function fbSet(p,d){await fetch(`${FIREBASE_URL}/${p}.json`,{method:'PUT',body:JSON.stringify(d)});}
async function fbUpdate(p,d){await fetch(`${FIREBASE_URL}/${p}.json`,{method:'PATCH',body:JSON.stringify(d)});}

function setSyncStatus(ok){
  document.getElementById('sync-dot').className='sync-dot '+(ok?'ok':'err');
  document.getElementById('sync-label').textContent=ok?'sync':'offline';
}

function startSync(){
  try{
    const es=new EventSource(`${FIREBASE_URL}/italia2.json?accept=text/event-stream`);
    es.addEventListener('put',e=>{
      const data=JSON.parse(e.data);
      if(data.data){
        if(data.data.days){days=data.data.days;renderAllCards();}
        if(data.data.checkedDays){checkedDays=data.data.checkedDays;updateCheckedUI();}
      }
      setSyncStatus(true);
    });
    es.onerror=()=>setSyncStatus(false);
  }catch(e){}
}

async function seedIfEmpty(){
  const ex=await fbGet('italia2/days');
  if(!ex){
    await fbSet('italia2/days',DEFAULT_DAYS);
    await fbSet('italia2/checkedDays',{});
  }
  const cd=await fbGet('italia2/checkedDays');
  checkedDays=cd||{};
}

  const tripEnd=new Date(2026,8,7,23,59); // 7 sep
  if(now<tripStart) return 'before';
  if(now>tripEnd) return 'after';
  return 'during';
}

function getTodayIdx(){
  const now=new Date();
  const start=new Date(2026,7,15);
  const diff=Math.floor((now-start)/86400000);
  if(diff<0||diff>=days.length) return 0;
  return diff;
}

// ── COUNTDOWN ──
function getCountdown(){
  const now=new Date();
  const diff=DEPARTURE-now;
  if(diff<=0) return null;
  const d=Math.floor(diff/86400000);
  const h=Math.floor((diff%86400000)/3600000);
  const m=Math.floor((diff%3600000)/60000);
  const s=Math.floor((diff%60000)/1000);
  return {d,h,m,s};
}

// ── RENDER ──
function renderNav(){
  const nav=document.getElementById('carousel-nav');
  const todayIdx=getTodayIdx();
  nav.innerHTML=days.map((d,i)=>{
    const isToday=i===todayIdx;
    const isActive=i===currentIdx;
    return `<button class="day-pill ${isActive?'active':''} ${isToday&&!isActive?'today':''}" onclick="goToDay(${i})">${d.fecha}</button>`;
  }).join('');
  const pills=nav.querySelectorAll('.day-pill');
  if(pills[currentIdx]) pills[currentIdx].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  document.getElementById('btn-prev').disabled=currentIdx<=0;
  document.getElementById('btn-next').disabled=currentIdx===days.length-1;
}

function renderAllCards(){
  const status=getTripStatus();
  const track=document.getElementById('swipe-track');
  const cards=days.map((d,i)=>renderDayCard(d,i)).join('');

  if(status!=='during'){
    track.innerHTML=getSpecialCard(status)+cards;
    if(status==='before') startCountdown();
  } else {
    track.innerHTML=cards;
  }
  updateSwipePosition(false);
  renderNav();
}

function renderDayCardsOnly(track){
  track.innerHTML=days.map((d,i)=>renderDayCard(d,i)).join('');
  updateSwipePosition(false);
  renderNav();
}

function startCountdown(){
  function tick(){
    const cd=getCountdown();
    if(!cd) return;
    const el_d=document.getElementById('cd-d');
    const el_h=document.getElementById('cd-h');
    const el_m=document.getElementById('cd-m');
    const el_s=document.getElementById('cd-s');
    if(el_d) el_d.textContent=String(cd.d).padStart(2,'0');
    if(el_h) el_h.textContent=String(cd.h).padStart(2,'0');
    if(el_m) el_m.textContent=String(cd.m).padStart(2,'0');
    if(el_s) el_s.textContent=String(cd.s).padStart(2,'0');
  }
  tick();
  setInterval(tick,1000);
}

// ── NAVIGATION ──
function goToDay(idx){
  if(idx<0||idx>=days.length) return;
  currentIdx=idx;
  updateSwipePosition(true);
  renderNav();
  if(window.google) setTimeout(()=>initMapForDay(idx),200);
  else loadGoogleMaps();
}

function updateSwipePosition(animate){
  const track=document.getElementById('swipe-track');
  if(!track) return;
  const status=getTripStatus();
  const hasSpecial=status!=='during';
  // idx=-1 → special card (pos 0), idx=0 → first day card (pos 1 if hasSpecial else 0)
  const pos=hasSpecial?(currentIdx+1):currentIdx;
  if(!animate) track.style.transition='none';
  track.style.transform=`translateX(-${Math.max(0,pos)*100}%)`;
  if(!animate) setTimeout(()=>track.style.transition='',50);
}

function goToDay(idx){
  if(idx<0||idx>=days.length) return;
  currentIdx=idx;
  updateSwipePosition(true);
  renderNav();
  if(window.google) setTimeout(()=>initMapForDay(idx),200);
  else loadGoogleMaps();
}
function loadGoogleMaps(){
  if(window._mapsLoading||window.google) return;
  window._mapsLoading=true;
  const s=document.createElement('script');
  s.src=`https://maps.googleapis.com/maps/api/js?key=${MAPS_KEY}&callback=onMapsReady&libraries=places`;
  s.async=true;
  document.head.appendChild(s);
}

window.onMapsReady=function(){
  window._mapsLoading=false;
  initMapForDay(currentIdx);
};

function initMapForDay(idx){
  if(!window.google||!days[idx]||dayMaps[idx]) return;
  const d=days[idx];
  const places=d.places||[];
  if(!places.length) return;
  const mapEl=document.getElementById(`map-${idx}`);
  const loadEl=document.getElementById(`map-loading-${idx}`);
  if(!mapEl) return;

  const map=new google.maps.Map(mapEl,{
    zoom:14,mapTypeControl:false,streetViewControl:false,
    fullscreenControl:false,zoomControl:true,
    gestureHandling:'greedy',
    clickableIcons:false,
  });
  dayMaps[idx]=map;
  if(loadEl) loadEl.style.display='none';

  const geo=new google.maps.Geocoder();
  const bounds=new google.maps.LatLngBounds();
  let done=0;
  const coords=[];

  places.forEach((place,pi)=>{
    geo.geocode({address:place},(res,status)=>{
      if(status==='OK'){
        const loc=res[0].geometry.location;
        bounds.extend(loc);
        coords.push(loc);
        const marker = new google.maps.Marker({
          position:loc,map,
          label:{text:String(pi+1),color:'#FF6740',fontSize:'11px',fontWeight:'700'},
          icon:{path:google.maps.SymbolPath.CIRCLE,scale:13,fillColor:'#ffffff',fillOpacity:1,strokeColor:'#FF6740',strokeWeight:2.5},
          title:place,
        });
        const infoWindow = new google.maps.InfoWindow({
          content:`<div style="font-family:-apple-system,sans-serif;font-size:13px;font-weight:600;color:#1A2A2E;padding:2px 4px;max-width:160px">${place.split(',')[0]}</div>`
        });
        marker.addListener('click',()=>{ infoWindow.open(map,marker); });
      }
      done++;
      if(done===places.length){
        if(coords.length>1) map.fitBounds(bounds,{top:30,right:30,bottom:30,left:30});
        else if(coords.length===1){map.setCenter(coords[0]);map.setZoom(15);}
        // Update open maps link
        const btn=document.querySelector(`#card-${idx} .open-maps-btn`);
        if(btn&&places.length>0){
          if(places.length===1){
            btn.href=`https://www.google.com/maps/search/${encodeURIComponent(places[0])}`;
          } else {
            const dest=places[places.length-1];
            const wps=places.slice(0,-1).map(p=>`+to:${encodeURIComponent(p)}`).join('');
            btn.href=`https://www.google.com/maps/dir/${encodeURIComponent(places[0])}${wps}/${encodeURIComponent(dest)}`;
          }
        }
      }
    });
  });
}

// ── DONE ──
async function toggleDone(idx){
  const v=!(checkedDays&&checkedDays[idx]);
  checkedDays=checkedDays||{};
  checkedDays[idx]=v;
  await fbUpdate('italia2/checkedDays',{[idx]:v});
  updateCheckedUI();
}
function updateCheckedUI(){
  days.forEach((_,i)=>{
    const btn=document.querySelector(`#card-${i} .done-btn-hero`);
    if(btn){
      const done=checkedDays&&checkedDays[i];
      btn.className=`done-btn-hero ${done?'done':''}`;
      btn.textContent=done?'✓ Listo':'Marcar listo';
    }
  });
}

// ── EDIT ──
function openEdit(idx){
  const d=days[idx];
  document.getElementById('edit-idx').value=idx;
  document.getElementById('edit-ciudad').value=d.ciudad||'';
  document.getElementById('edit-hospedaje').value=d.hospedaje||'';
  document.getElementById('edit-checkin').value=d.checkin||'';
  document.getElementById('edit-transport').value=d.transport||'';
  document.getElementById('edit-transport-text').value=d.transport_text||'';
  document.getElementById('edit-recordar').value=d.recordar||'';
  document.getElementById('edit-manana').value=d.manana||'';
  document.getElementById('edit-almuerzo').value=d.almuerzo||'';
  document.getElementById('edit-tarde').value=d.tarde||'';
  document.getElementById('edit-noche').value=d.noche||'';
  const tks=(d.tickets||[]).map(t=>`${t.name}|${t.link||''}`).join('\n');
  document.getElementById('edit-tickets').value=tks;
  openModal('modal-edit');
}

async function saveEdit(){
  const idx=+document.getElementById('edit-idx').value;
  days[idx].ciudad=document.getElementById('edit-ciudad').value;
  days[idx].hospedaje=document.getElementById('edit-hospedaje').value||null;
  days[idx].checkin=document.getElementById('edit-checkin').value||null;
  days[idx].transport=document.getElementById('edit-transport').value||null;
  days[idx].transport_text=document.getElementById('edit-transport-text').value||'';
  days[idx].recordar=document.getElementById('edit-recordar').value;
  days[idx].manana=document.getElementById('edit-manana').value;
  days[idx].almuerzo=document.getElementById('edit-almuerzo').value;
  days[idx].tarde=document.getElementById('edit-tarde').value;
  days[idx].noche=document.getElementById('edit-noche').value;
  // Parse tickets
  const tksRaw=document.getElementById('edit-tickets').value;
  days[idx].tickets=tksRaw.trim()?tksRaw.split('\n').filter(l=>l.trim()).map(l=>{
    const [name,...rest]=l.split('|');
    return {name:name.trim(),link:(rest.join('|')||'').trim()};
  }):[];
  await fbSet('italia2/days',days);
  closeModal('modal-edit');
  // Re-render card
  const card=document.getElementById(`card-${idx}`);
  if(card){
    const tmp=document.createElement('div');
    tmp.innerHTML=renderDayCard(days[idx],idx);
    card.replaceWith(tmp.firstElementChild);
    dayMaps[idx]=null;
    if(window.google) setTimeout(()=>initMapForDay(idx),100);
  }
  renderNav();
  showToast('Día actualizado ✓');
}

// ── SWAP ──
function openSwap(idx){
  swapFromIdx=idx;swapToIdx=null;
  const d=days[idx];
  document.getElementById('swap-from-text').textContent=`${d.fecha} · ${d.ciudad}`;
  const siblings=days.map((dd,ii)=>({...dd,idx:ii})).filter(dd=>dd.seccion===d.seccion&&!dd.locked&&dd.idx!==idx);
  document.getElementById('swap-day-list').innerHTML=siblings.map(s=>`
    <div class="swap-day-item" id="swap-item-${s.idx}" onclick="selectSwap(${s.idx})">
      <div class="swap-day-date">${s.fecha}</div>
      <div class="swap-day-name">${s.ciudad}</div>
      <div class="swap-day-radio" id="swap-radio-${s.idx}"><div class="swap-day-radio-inner"></div></div>
    </div>`).join('');
  openModal('modal-swap');
}
function selectSwap(idx){
  if(swapToIdx!==null){
    document.getElementById(`swap-item-${swapToIdx}`)?.classList.remove('selected');
  }
  swapToIdx=idx;
  document.getElementById(`swap-item-${idx}`)?.classList.add('selected');
}
async function confirmSwap(){
  if(swapToIdx===null){showToast('Elegí un día primero');return;}
  const fields=['ciudad','hospedaje','checkin','transport','transport_text','manana','almuerzo','tarde','noche','recordar','tickets','places','flights'];
  fields.forEach(f=>{const tmp=days[swapFromIdx][f];days[swapFromIdx][f]=days[swapToIdx][f];days[swapToIdx][f]=tmp;});
  await fbSet('italia2/days',days);
  closeModal('modal-swap');
  [swapFromIdx,swapToIdx].forEach(idx=>{
    const card=document.getElementById(`card-${idx}`);
    if(card){
      const tmp=document.createElement('div');
      tmp.innerHTML=renderDayCard(days[idx],idx);
      card.replaceWith(tmp.firstElementChild);
      dayMaps[idx]=null;
    }
  });
  renderNav();
  if(window.google) setTimeout(()=>initMapForDay(currentIdx),100);
  showToast('Días intercambiados ✓');
  swapFromIdx=null;swapToIdx=null;
}

// ── CALENDAR ──
function openCal(){
  const tripMap={};
  days.forEach((d,i)=>{tripMap[d.fecha]={idx:i,seccion:d.seccion};});
  const months=[{year:2026,month:7,name:'Agosto 2026'},{year:2026,month:8,name:'Septiembre 2026'}];
  const wdays=['D','L','M','M','J','V','S'];
  const today=new Date();
  let html='';
  months.forEach(({year,month,name})=>{
    const first=new Date(year,month,1).getDay();
    const dim=new Date(year,month+1,0).getDate();
    html+=`<div class="cal-month"><div class="cal-month-name">${name}</div>
      <div class="cal-weekdays">${wdays.map(w=>`<div class="cal-weekday">${w}</div>`).join('')}</div>
      <div class="cal-grid">`;
    for(let e=0;e<first;e++) html+=`<div class="cal-cell"></div>`;
    for(let d=1;d<=dim;d++){
      const dd=String(d).padStart(2,'0');
      const mm=String(month+1).padStart(2,'0');
      const key=`${dd}-${mm}`;
      const trip=tripMap[key];
      const isToday=today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===d;
      const isCurrent=trip&&trip.idx===currentIdx;
      const color=trip?(CITY_COLORS[trip.seccion]||'#333'):null;
      if(trip){
        html+=`<div class="cal-cell in-trip ${isCurrent?'is-current':''} ${isToday&&!isCurrent?'is-today':''}" onclick="goToDay(${trip.idx});closeCal()">
          ${d}${!isCurrent&&color?`<span class="city-dot" style="background:${color}"></span>`:''}
        </div>`;
      } else {
        html+=`<div class="cal-cell ${isToday?'is-today':''}">${d}</div>`;
      }
    }
    html+=`</div></div>`;
  });
  const secs=[...new Set(days.map(d=>d.seccion))].filter(s=>s!=='Vuelo');
  html+=`<div class="cal-legend">${secs.map(s=>`<div class="cal-legend-item"><div class="cal-legend-dot" style="background:${CITY_COLORS[s]||'#333'}"></div>${s}</div>`).join('')}</div>`;
  document.getElementById('cal-content').innerHTML=html;
  document.getElementById('cal-overlay').classList.add('open');
}
function closeCal(){document.getElementById('cal-overlay').classList.remove('open');}

// ── MODAL ──
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));

// ── TOAST ──
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ── INIT ──
async function init(){
  try{
    await seedIfEmpty();
    days=await fbGet('italia2/days')||DEFAULT_DAYS;
    const cd=await fbGet('italia2/checkedDays');
    checkedDays=cd||{};
    setSyncStatus(true);
  }catch(e){
    days=DEFAULT_DAYS;
    setSyncStatus(false);
  }
  const status=getTripStatus();
  // currentIdx=-1 means special screen, 0..n means day cards
  currentIdx=status==='during'?getTodayIdx():-1;
  renderAllCards();
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  loadGoogleMaps();
  try{startSync();}catch(e){}
}
init();
</script>
